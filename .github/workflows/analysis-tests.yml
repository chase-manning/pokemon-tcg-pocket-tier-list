name: Analysis Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "yarn"
          cache-dependency-path: "analysis/yarn.lock"

      - name: Install dependencies
        run: |
          cd analysis
          yarn install

      - name: Run tests
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: |
          cd analysis
          yarn test
