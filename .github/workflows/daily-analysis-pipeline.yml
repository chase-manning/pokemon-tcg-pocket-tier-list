name: Update best decks

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Record run date
        id: run-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Install canvas native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "yarn"
          cache-dependency-path: "analysis/yarn.lock"

      - name: Install analysis dependencies
        run: |
          cd analysis
          yarn install --frozen-lockfile

      - name: Run pipeline
        env:
          LIMITLESS_API_KEY: ${{ secrets.LIMITLESS_API_KEY }}
        run: |
          cd analysis
          yarn download
          yarn start

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.js

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(data): update best decks from daily pipeline run"
          title: "Update best decks (${{ steps.run-date.outputs.date }})"
          body: |
            Automated run of the analysis pipeline on ${{ steps.run-date.outputs.date }}.

            Updates deck data, OG images, the sitemap, and the last-updated timestamp.
          branch: automated/daily-pipeline-update
          delete-branch: true
          labels: automated
